[project]
name = "awesome-rag-learning"
version = "0.1.0"
description = "Runnable learning examples for Retrieval-Augmented Generation"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
learner = [
    "jupyterlab>=4.0",
    "ipykernel>=6.29",
    "llama-index>=0.12",
    "llama-index-embeddings-huggingface>=0.5",
    "qdrant-client>=1.14",
    "sentence-transformers>=3.4",
    "pydantic>=2.0",
    "fastapi>=0.110.0",
    "ragas>=0.4,<0.5",
    "docling",
    "pandas",
    "langchain-experimental",
    "langchain",
    "langchain-classic",
    "langchain-community",
    "langchain-huggingface",
    "langchain-chroma",
    "langchain-core",
    "langchain-openai",
    "chromadb",
    "rank-bm25",
    "networkx",
    "matplotlib",
    "langgraph",
    "langchain-qdrant",
    "unstructured[md]"
]
contributor = [
    "awesome-rag-learning[learner]",
    "pytest>=8.0",
    "nbclient>=0.10",
    "nbformat>=5.10"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
py-modules = []
packages = []
