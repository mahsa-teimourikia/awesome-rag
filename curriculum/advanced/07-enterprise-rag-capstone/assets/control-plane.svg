<text x="900.0" y="524.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#16324F">Bounded correction /</text>
<text x="900.0" y="548.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#16324F">investigation</text>
