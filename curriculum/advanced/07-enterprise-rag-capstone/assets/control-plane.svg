<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Adaptive, corrective, and agentic control are separate decisions</title><desc id="desc">A control flow from a query through requirements, route proposal, policy authorization, evidence execution, quality assessment, bounded recovery, and a terminal response; a trusted principal independently constrains policy.</desc>
<defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#16324F" flood-opacity="0.10"/></filter></defs>
<rect width="100%" height="100%" fill="#F7F9FC"/>
<text x="60" y="70" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#16324F">Adaptive, corrective, and agentic control are separate decisions</text>
<text x="60" y="103" font-family="Inter, Arial, sans-serif" font-size="17" fill="#52606D">A route proposal never grants authority; every recovery is bounded and re-evaluated.</text>
