<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Adaptive, corrective, and agentic control are separate decisions</title><desc id="desc">A control flow from query to trusted principal, requirements, route proposal, policy authorization, evidence execution, quality check, bounded recovery, and terminal response.</desc>
<defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#16324F" flood-opacity="0.10"/></filter></defs>
<rect width="100%" height="100%" fill="#F7F9FC"/>
<text x="60" y="70" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700" fill="#16324F">Adaptive, corrective, and agentic control are separate decisions</text>
<text x="60" y="103" font-family="Inter,Arial,sans-serif" font-size="17" fill="#52606D">A route proposal never grants authority; every recovery is bounded and re-evaluated.</text>
<rect x="70" y="250" width="150" height="80" rx="16" fill="#EAF1FF" stroke="#2F6BFF" stroke-width="2.5" filter="url(#shadow)"/>
<text x="145.0" y="297.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#16324F">Query</text>
<rect x="70" y="480" width="150" height="80" rx="16" fill="#FFF1DF" stroke="#F59E42" stroke-width="2.5" filter="url(#shadow)"/>
<text x="145.0" y="527.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#16324F">Trusted principal</text>
<rect x="330" y="250" width="190" height="90" rx="16" fill="#F0EEFF" stroke="#7667E8" stroke-width="2.5" filter="url(#shadow)"/>
<text x="425.0" y="302.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#16324F">Requirement packet</text>
<rect x="620" y="250" width="180" height="90" rx="16" fill="#F0EEFF" stroke="#7667E8" stroke-width="2.5" filter="url(#shadow)"/>
<text x="710.0" y="302.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#16324F">Route proposal</text>
<rect x="900" y="245" width="220" height="105" rx="16" fill="#FFF1DF" stroke="#F59E42" stroke-width="2.5" filter="url(#shadow)"/>
<text x="1010.0" y="304.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#16324F">Policy decision</text>
<text x="1010.0" y="333" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#52606D">identity · route · budget</text>
<rect x="1240" y="250" width="230" height="90" rx="16" fill="#E5F7F6" stroke="#16A3A5" stroke-width="2.5" filter="url(#shadow)"/>
<text x="1355.0" y="302.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#16324F">Execute evidence route</text>
<rect x="1240" y="470" width="230" height="90" rx="16" fill="#F0EEFF" stroke="#7667E8" stroke-width="2.5" filter="url(#shadow)"/>
<text x="1355.0" y="522.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#16324F">Evidence sufficient?</text>
<rect x="790" y="470" width="260" height="90" rx="16" fill="#F0EEFF" stroke="#7667E8" stroke-width="2.5" filter="url(#shadow)"/>
<text x="920.0" y="510.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#16324F">Bounded correction /</text>
<text x="920.0" y="534.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#16324F">investigation</text>
<rect x="1110" y="690" width="360" height="90" rx="16" fill="#EAF1FF" stroke="#2F6BFF" stroke-width="2.5" filter="url(#shadow)"/>
<text x="1290.0" y="730.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#16324F">Answer · clarify ·</text>
<text x="1290.0" y="754.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#16324F">abstain · approval</text>
