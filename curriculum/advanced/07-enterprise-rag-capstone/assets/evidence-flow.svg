<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">One evidence contract across heterogeneous sources</title><desc id="desc">Six source-specific evidence types flow through adapters into a common Evidence contract, then quality validation, an evidence ledger, and claim-linked answers.</desc>
