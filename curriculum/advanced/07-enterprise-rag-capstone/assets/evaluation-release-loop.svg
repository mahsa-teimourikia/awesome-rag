<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Evaluation and release loop</title><desc id="desc">A release loop from versioned evaluation cases through offline evaluation, a release gate, shadow and canary stages, promotion or rollback, and incident-derived regression tests.</desc>
<defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#16324F" flood-opacity="0.10"/></filter></defs>
<rect width="100%" height="100%" fill="#F7F9FC"/>
<text x="60" y="70" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700" fill="#16324F">Evaluation and release loop</text>
<text x="60" y="103" font-family="Inter,Arial,sans-serif" font-size="17" fill="#52606D">Hard safety invariants block a release regardless of average quality.</text>
<rect x="90" y="225" width="210" height="95" rx="16" fill="#E5F7F6" stroke="#16A3A5" stroke-width="2.5" filter="url(#shadow)"/>
<text x="195.0" y="267.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#16324F">Versioned evaluation</text>
<text x="195.0" y="291.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#16324F">set</text>
<rect x="390" y="225" width="210" height="95" rx="16" fill="#F0EEFF" stroke="#7667E8" stroke-width="2.5" filter="url(#shadow)"/>
<text x="495.0" y="279.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#16324F">Offline scorecards</text>
<rect x="690" y="215" width="230" height="115" rx="16" fill="#FFF1DF" stroke="#F59E42" stroke-width="2.5" filter="url(#shadow)"/>
<text x="805.0" y="267.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#16324F">PROMOTE · HOLD</text>
<text x="805.0" y="291.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#16324F">· BLOCK</text>
<rect x="1030" y="225" width="150" height="95" rx="16" fill="#FFFFFF" stroke="#8A98A8" stroke-width="2.5" filter="url(#shadow)"/>
<text x="1105.0" y="279.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#16324F">Shadow</text>
<rect x="1280" y="225" width="150" height="95" rx="16" fill="#FFFFFF" stroke="#8A98A8" stroke-width="2.5" filter="url(#shadow)"/>
<text x="1355.0" y="279.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#16324F">Canary</text>
<rect x="1260" y="465" width="190" height="90" rx="16" fill="#EAF1FF" stroke="#2F6BFF" stroke-width="2.5" filter="url(#shadow)"/>
<text x="1355.0" y="517.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#16324F">Promote</text>
<rect x="690" y="465" width="230" height="90" rx="16" fill="#FFF0F0" stroke="#D64545" stroke-width="2.5" filter="url(#shadow)"/>
<text x="805.0" y="517.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#16324F">Rollback / contain</text>
<rect x="990" y="465" width="180" height="90" rx="16" fill="#FFF1DF" stroke="#F59E42" stroke-width="2.5" filter="url(#shadow)"/>
<text x="1080.0" y="517.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#16324F">Incident analysis</text>
<rect x="740" y="700" width="210" height="90" rx="16" fill="#E5F7F6" stroke="#16A3A5" stroke-width="2.5" filter="url(#shadow)"/>
<text x="845.0" y="752.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#16324F">New regression case</text>
