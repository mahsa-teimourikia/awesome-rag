<text x="60" y="70" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700" fill="#16324F">Northstar Enterprise RAG reference architecture</text>
<text x="60" y="103" font-family="Inter,Arial,sans-serif" font-size="17" fill="#52606D">Identity constrains evidence; adaptive and corrective control earn complexity per request.</text>
<rect x="300" y="140" width="560" height="240" rx="20" fill="#FBFCFF" stroke="#D7DEE8" stroke-width="2" stroke-dasharray="7 7"/><text x="320" y="172" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#52606D">CONTROL PLANE</text>
