<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="operating-loop-title operating-loop-desc">
<title id="operating-loop-title">Production RAG operating loop</title>
<desc id="operating-loop-desc">A release operations loop connecting evaluation, deployment, observation, incident response, rollback, and regression testing.</desc>
<rect width="1200" height="420" fill="white"/>
<defs>
  <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0 0 L7 3.5 L0 7 Z" fill="#64748B"/>
  </marker>
</defs>
<g font-family="Arial, Helvetica, sans-serif">
<text x="55" y="52" font-size="29" font-weight="700" fill="#111827">Production RAG operating loop</text>
<text x="55" y="82" font-size="16" fill="#475569">Observe, evaluate, release carefully, recover safely, and learn from failures.</text>
<rect x="55" y="165" width="180" height="75" rx="14" fill="#EEF2FF" stroke="#64748B" stroke-width="2"/><text x="145" y="208" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2937">Observe</text><line x1="235" y1="202" x2="270" y2="202" stroke="#64748B" stroke-width="2" marker-end="url(#a)"/><rect x="280" y="165" width="180" height="75" rx="14" fill="#ECFEFF" stroke="#64748B" stroke-width="2"/><text x="370" y="208" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2937">Evaluate</text><line x1="460" y1="202" x2="495" y2="202" stroke="#64748B" stroke-width="2" marker-end="url(#a)"/><rect x="505" y="165" width="180" height="75" rx="14" fill="#F0FDF4" stroke="#64748B" stroke-width="2"/><text x="595" y="208" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2937">Release</text><line x1="685" y1="202" x2="720" y2="202" stroke="#64748B" stroke-width="2" marker-end="url(#a)"/><rect x="730" y="165" width="180" height="75" rx="14" fill="#FFF7ED" stroke="#64748B" stroke-width="2"/><text x="820" y="208" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2937">Canary</text><line x1="910" y1="202" x2="945" y2="202" stroke="#64748B" stroke-width="2" marker-end="url(#a)"/><rect x="955" y="165" width="180" height="75" rx="14" fill="#FAF5FF" stroke="#64748B" stroke-width="2"/><text x="1045" y="208" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2937">Recover</text><path d="M1135 240 C1135 340 145 340 145 240" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#a)"/><text x="640" y="350" text-anchor="middle" font-size="13" fill="#475569">incidents and production failures feed the next evaluation cycle</text>
</g></svg>
