<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="trace-spans-title trace-spans-desc">
<title id="trace-spans-title">Stage-level RAG trace spans</title>
<desc id="trace-spans-desc">A parent request trace containing authorization, routing, retrieval, reranking, context, generation, and verification spans.</desc>
<rect width="1200" height="400" fill="white"/>
<defs>
  <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0 0 L7 3.5 L0 7 Z" fill="#64748B"/>
  </marker>
</defs>
<g font-family="Arial, Helvetica, sans-serif">
<text x="55" y="52" font-size="29" font-weight="700" fill="#111827">Stage-level trace spans</text>
<text x="55" y="82" font-size="16" fill="#475569">End-to-end latency alone cannot tell you which dependency is degrading.</text>
<rect x="50" y="170" width="140" height="70" rx="13" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/><text x="120" y="212" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">Request</text><line x1="190" y1="205" x2="210" y2="205" stroke="#64748B" stroke-width="2" marker-end="url(#a)"/><rect x="220" y="170" width="140" height="70" rx="13" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/><text x="290" y="212" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">Authorization</text><line x1="360" y1="205" x2="410" y2="205" stroke="#64748B" stroke-width="2" marker-end="url(#a)"/><rect x="420" y="170" width="140" height="70" rx="13" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/><text x="490" y="212" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">Retrieval</text><line x1="560" y1="205" x2="580" y2="205" stroke="#64748B" stroke-width="2" marker-end="url(#a)"/><rect x="590" y="170" width="140" height="70" rx="13" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/><text x="660" y="212" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">Reranking</text><line x1="730" y1="205" x2="750" y2="205" stroke="#64748B" stroke-width="2" marker-end="url(#a)"/><rect x="760" y="170" width="140" height="70" rx="13" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/><text x="830" y="212" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">Generation</text><line x1="900" y1="205" x2="930" y2="205" stroke="#64748B" stroke-width="2" marker-end="url(#a)"/><rect x="940" y="170" width="140" height="70" rx="13" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/><text x="1010" y="212" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">Verification</text><text x="600" y="330" text-anchor="middle" font-size="14" fill="#475569">Each stage should have its own latency, error, policy, and version attributes.</text>
</g></svg>
