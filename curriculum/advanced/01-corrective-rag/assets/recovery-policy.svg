<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
<title id="title">Finite recovery policy</title>
<desc id="desc">Weak evidence can trigger only an approved rewrite, alternate retriever, external source, clarification, or abstention, each with authorization and budget limits.</desc>
<rect width="1200" height="480" fill="white"/>
<defs>
  <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0 0 L7 3.5 L0 7 Z" fill="#64748B"/>
  </marker>
</defs>
<g font-family="Arial, Helvetica, sans-serif">
<text x="55" y="52" font-size="29" font-weight="700" fill="#111827">Finite recovery policy</text>
<text x="55" y="82" font-size="16" fill="#475569">A corrective controller selects only policy-approved recovery actions.</text>
<rect x="480" y="125" width="240" height="70" rx="14" fill="#EEF2FF" stroke="#6366F1" stroke-width="2"/><text x="600" y="168" text-anchor="middle" font-size="16" font-weight="700" fill="#312E81">Weak evidence</text><line x1="600" y1="195" x2="185" y2="290" stroke="#64748B" stroke-width="2" marker-end="url(#a)"/><rect x="100" y="290" width="170" height="70" rx="14" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/><text x="185" y="332" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">Rewrite</text><line x1="600" y1="195" x2="445" y2="290" stroke="#64748B" stroke-width="2" marker-end="url(#a)"/><rect x="360" y="290" width="170" height="70" rx="14" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/><text x="445" y="332" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">Alternate retriever</text><line x1="600" y1="195" x2="735" y2="290" stroke="#64748B" stroke-width="2" marker-end="url(#a)"/><rect x="650" y="290" width="170" height="70" rx="14" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/><text x="735" y="332" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">Approved external</text><line x1="600" y1="195" x2="1015" y2="290" stroke="#64748B" stroke-width="2" marker-end="url(#a)"/><rect x="930" y="290" width="170" height="70" rx="14" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/><text x="1015" y="332" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">Clarify / abstain</text><text x="600" y="430" text-anchor="middle" font-size="14" fill="#475569">Every route has authorization, attempt, time, and cost limits.</text>
</g></svg>
