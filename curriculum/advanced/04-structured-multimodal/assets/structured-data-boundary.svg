<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc">
<title id="title">Structured data safety boundary</title>
<desc id="desc">Authorized rows flow through validated filtering, aggregation, and unit checks into an exact result with row citations; an LLM may explain the result but does not recompute it.</desc>
<rect width="1200" height="410" fill="white"/>
<defs>
  <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0 0 L7 3.5 L0 7 Z" fill="#64748B"/>
  </marker>
</defs>
<g font-family="Arial, Helvetica, sans-serif">
<text x="55" y="52" font-size="29" font-weight="700" fill="#111827">Structured-data boundary</text>
<text x="55" y="82" font-size="16" fill="#475569">Prefer constrained deterministic execution over arbitrary generated code.</text>
<rect x="80" y="175" width="230" height="80" rx="14" fill="#EEF2FF" stroke="#6366F1" stroke-width="2"/><text x="195" y="222" text-anchor="middle" font-size="15" font-weight="700" fill="#312E81">Authorized rows</text><line x1="310" y1="215" x2="430" y2="215" stroke="#64748B" stroke-width="2" marker-end="url(#a)"/><rect x="440" y="160" width="260" height="110" rx="15" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/><text x="570" y="200" text-anchor="middle" font-size="16" font-weight="700" fill="#14532D">Validated computation</text><text x="570" y="230" text-anchor="middle" font-size="13" fill="#475569">filter · aggregate · units</text><line x1="700" y1="215" x2="820" y2="215" stroke="#64748B" stroke-width="2" marker-end="url(#a)"/><rect x="830" y="175" width="290" height="80" rx="14" fill="#ECFEFF" stroke="#0891B2" stroke-width="2"/><text x="975" y="210" text-anchor="middle" font-size="15" font-weight="700" fill="#164E63">Result + row citations</text><text x="975" y="235" text-anchor="middle" font-size="13" fill="#475569">LLM may explain, not recompute</text>
</g></svg>
