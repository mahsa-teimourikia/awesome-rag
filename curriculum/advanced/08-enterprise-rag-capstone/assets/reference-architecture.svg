<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Northstar Enterprise RAG reference architecture</title><desc id="desc">A left-to-right enterprise RAG architecture from an authenticated request through authorization, routing, evidence systems, quality control, an evidence ledger, validation, and observability.</desc>
