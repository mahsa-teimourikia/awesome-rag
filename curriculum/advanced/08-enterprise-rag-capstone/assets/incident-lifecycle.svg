<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">RAG incident lifecycle</title><desc id="desc">An incident lifecycle from detection and classification through containment, investigation, rollback or fix, verification, regression testing, postmortem, and monitoring that feeds new signals back into detection.</desc>
<defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#16324F" flood-opacity="0.10"/></filter></defs>
<rect width="100%" height="100%" fill="#F7F9FC"/>
<text x="60" y="70" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#16324F">RAG incident lifecycle</text>
<text x="60" y="103" font-family="Inter, Arial, sans-serif" font-size="17" fill="#52606D">Restore a safe state first; preserve evidence; convert the failure into a permanent test.</text>
<path d="M 250 270.0 L 330 270.0" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="330,270.0 317.0,276.0 317.0,264.0" fill="#52606D"/>
<path d="M 530 270.0 L 620 270.0" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="620,270.0 607.0,276.0 607.0,264.0" fill="#52606D"/>
<path d="M 830 270.0 L 920 270.0" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="920,270.0 907.0,276.0 907.0,264.0" fill="#52606D"/>
<path d="M 1120 270.0 L 1210 270.0" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="1210,270.0 1197.0,276.0 1197.0,264.0" fill="#52606D"/>
<path d="M 1330.0 320 L 1330.0 500" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="1330.0,500 1324.0,487.0 1336.0,487.0" fill="#52606D"/>
<path d="M 1210 550.0 L 1090 550.0" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="1090,550.0 1103.0,544.0 1103.0,556.0" fill="#52606D"/>
<path d="M 850 550.0 L 730 550.0" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="730,550.0 743.0,544.0 743.0,556.0" fill="#52606D"/>
<path d="M 595.0 600 L 595.0 700" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="595.0,700 589.0,687.0 601.0,687.0" fill="#52606D"/>
<path d="M 460 740.0 L 200 740 L 200 400 L 50 400 L 50 290 L 70 290.0" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="70,290.0 57.0,296.0 57.0,284.0" fill="#52606D"/>
<rect x="70" y="220" width="180" height="100" rx="16" fill="#FFF0F0" stroke="#D64545" stroke-width="2.5" filter="url(#shadow)"/>
<text x="160.0" y="263.5" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#16324F">Detect</text>
<text x="160.0" y="291.5" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">signal + impact</text>
<rect x="330" y="220" width="200" height="100" rx="16" fill="#FFF1DF" stroke="#F59E42" stroke-width="2.5" filter="url(#shadow)"/>
<text x="430.0" y="263.5" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#16324F">Classify</text>
<text x="430.0" y="291.5" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">quality · safety · ops</text>
<rect x="620" y="220" width="210" height="100" rx="16" fill="#FFF0F0" stroke="#D64545" stroke-width="2.5" filter="url(#shadow)"/>
<text x="725.0" y="263.5" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#16324F">Contain</text>
<text x="725.0" y="291.5" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">disable route · rollback</text>
<rect x="920" y="220" width="200" height="100" rx="16" fill="#F0EEFF" stroke="#7667E8" stroke-width="2.5" filter="url(#shadow)"/>
<text x="1020.0" y="263.5" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#16324F">Investigate</text>
<text x="1020.0" y="291.5" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">trace + versions</text>
<rect x="1210" y="220" width="240" height="100" rx="16" fill="#FFF1DF" stroke="#F59E42" stroke-width="2.5" filter="url(#shadow)"/>
<text x="1330.0" y="263.5" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#16324F">Rollback or fix</text>
<text x="1330.0" y="291.5" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">compatible safe state</text>
<rect x="1210" y="500" width="240" height="100" rx="16" fill="#EAF1FF" stroke="#2F6BFF" stroke-width="2.5" filter="url(#shadow)"/>
<text x="1330.0" y="543.5" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#16324F">Verify recovery</text>
<text x="1330.0" y="571.5" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">hard invariants first</text>
<rect x="850" y="500" width="240" height="100" rx="16" fill="#E5F7F6" stroke="#16A3A5" stroke-width="2.5" filter="url(#shadow)"/>
<text x="970.0" y="543.5" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#16324F">Add regression case</text>
<text x="970.0" y="571.5" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52606D">reproduce root cause</text>
<rect x="460" y="500" width="270" height="100" rx="16" fill="#FFFFFF" stroke="#8A98A8" stroke-width="2.5" filter="url(#shadow)"/>
<text x="595.0" y="544.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#16324F">Postmortem + control</text>
<text x="595.0" y="568.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#16324F">update</text>
<rect x="460" y="700" width="270" height="80" rx="16" fill="#FFFFFF" stroke="#8A98A8" stroke-width="2.5" filter="url(#shadow)"/>
<text x="595.0" y="734.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#16324F">Monitor the changed</text>
<text x="595.0" y="758.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#16324F">control</text>
<rect x="75.0" y="382" width="100" height="32" rx="8" fill="#F7F9FC"/><text x="125" y="404" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#52606D">new signal</text>
</svg>
