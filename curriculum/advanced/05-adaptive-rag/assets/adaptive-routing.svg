<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Authorization-aware adaptive routing controller</title>
<desc id="desc">Query and trusted principal context flow through requirement extraction, a route proposal, and deterministic policy. Policy dispatches only authorized routes to direct, internal text, structured, graph, external, or clarify handlers, which return evidence-backed results or explicit terminal states.</desc>
