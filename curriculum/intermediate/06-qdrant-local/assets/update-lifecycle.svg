<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
<title>Safe vector update lifecycle</title>
<desc>Old version points are identified and removed or tombstoned before the replacement version becomes current evidence.</desc>
<rect width="1200" height="420" fill="white"/>
<defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#64748B"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif">
<text x="55" y="52" font-size="29" font-weight="700" fill="#111827">Safe vector update lifecycle</text>
<text x="55" y="82" font-size="16" fill="#475569">Do not append a new source version while leaving contradictory old chunks active.</text>
<rect x="80" y="165" width="220" height="85" rx="15" fill="#FEF2F2" stroke="#EF4444" stroke-width="2"/><text x="190" y="200" text-anchor="middle" font-size="16" font-weight="700" fill="#991B1B">V1 points</text><text x="190" y="225" text-anchor="middle" font-size="13" fill="#475569">old gateway</text><line x1="300" y1="207" x2="420" y2="207" stroke="#64748B" stroke-width="2" marker-end="url(#a)"/><rect x="430" y="150" width="290" height="115" rx="15" fill="#FFF7ED" stroke="#F97316" stroke-width="2"/><text x="575" y="190" text-anchor="middle" font-size="16" font-weight="700" fill="#7C2D12">Update transaction</text><text x="575" y="220" text-anchor="middle" font-size="13" fill="#475569">identify old IDs → remove/tombstone</text><line x1="720" y1="207" x2="850" y2="207" stroke="#64748B" stroke-width="2" marker-end="url(#a)"/><rect x="860" y="165" width="260" height="85" rx="15" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/><text x="990" y="200" text-anchor="middle" font-size="16" font-weight="700" fill="#14532D">V2 points only</text><text x="990" y="225" text-anchor="middle" font-size="13" fill="#475569">current evidence</text>
</g></svg>
