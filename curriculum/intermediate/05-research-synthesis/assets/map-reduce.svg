<defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#64748B"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif">
<text x="55" y="52" font-size="29" font-weight="700" fill="#111827">Map-Reduce synthesis</text>
<text x="55" y="82" font-size="16" fill="#475569">Extract evidence per source, then combine claims in a bounded reduce step.</text>
<rect x="70" y="145" width="210" height="70" rx="14" fill="#EEF2FF" stroke="#6366F1" stroke-width="2"/><text x="175" y="188" text-anchor="middle" font-size="15" font-weight="700" fill="#312E81">Doc 1 → claims</text><rect x="70" y="245" width="210" height="70" rx="14" fill="#EEF2FF" stroke="#6366F1" stroke-width="2"/><text x="175" y="288" text-anchor="middle" font-size="15" font-weight="700" fill="#312E81">Doc 2 → claims</text><rect x="70" y="345" width="210" height="70" rx="14" fill="#EEF2FF" stroke="#6366F1" stroke-width="2"/><text x="175" y="388" text-anchor="middle" font-size="15" font-weight="700" fill="#312E81">Doc N → claims</text><line x1="280" y1="180" x2="520" y2="280" stroke="#64748B" stroke-width="2" marker-end="url(#a)"/><line x1="280" y1="280" x2="520" y2="280" stroke="#64748B" stroke-width="2" marker-end="url(#a)"/><line x1="280" y1="380" x2="520" y2="280" stroke="#64748B" stroke-width="2" marker-end="url(#a)"/><rect x="530" y="230" width="220" height="100" rx="15" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/><text x="640" y="273" text-anchor="middle" font-size="17" font-weight="700" fill="#14532D">Reduce</text><text x="640" y="300" text-anchor="middle" font-size="13" fill="#475569">merge claims + conflicts</text><line x1="750" y1="280" x2="900" y2="280" stroke="#64748B" stroke-width="2" marker-end="url(#a)"/><rect x="910" y="230" width="220" height="100" rx="15" fill="#FAF5FF" stroke="#A855F7" stroke-width="2"/><text x="1020" y="287" text-anchor="middle" font-size="17" font-weight="700" fill="#6B21A8">Synthesis</text>
