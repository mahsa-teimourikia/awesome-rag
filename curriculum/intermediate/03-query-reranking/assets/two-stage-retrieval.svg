<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410">
<rect width="1200" height="410" fill="white"/>
<defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#64748B"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif">
<text x="55" y="52" font-size="29" font-weight="700" fill="#111827">Two-stage retrieval</text>
<text x="55" y="82" font-size="16" fill="#475569">Use a fast retriever for recall, then a slower model for precision.</text>
<rect x="70" y="160" width="210" height="100" rx="15" fill="#EEF2FF" stroke="#64748B" stroke-width="2"/><text x="175" y="198" text-anchor="middle" font-size="17" font-weight="700" fill="#1F2937">Corpus</text><text x="175" y="228" text-anchor="middle" font-size="13" fill="#64748B">millions</text><line x1="280" y1="210" x2="340" y2="210" stroke="#64748B" stroke-width="2" marker-end="url(#a)"/><rect x="350" y="160" width="210" height="100" rx="15" fill="#ECFEFF" stroke="#64748B" stroke-width="2"/><text x="455" y="198" text-anchor="middle" font-size="17" font-weight="700" fill="#1F2937">First stage</text><text x="455" y="228" text-anchor="middle" font-size="13" fill="#64748B">top 20–100</text><line x1="560" y1="210" x2="620" y2="210" stroke="#64748B" stroke-width="2" marker-end="url(#a)"/><rect x="630" y="160" width="210" height="100" rx="15" fill="#FFF7ED" stroke="#64748B" stroke-width="2"/><text x="735" y="198" text-anchor="middle" font-size="17" font-weight="700" fill="#1F2937">Cross-encoder</text><text x="735" y="228" text-anchor="middle" font-size="13" fill="#64748B">joint scoring</text><line x1="840" y1="210" x2="900" y2="210" stroke="#64748B" stroke-width="2" marker-end="url(#a)"/><rect x="910" y="160" width="210" height="100" rx="15" fill="#F0FDF4" stroke="#64748B" stroke-width="2"/><text x="1015" y="198" text-anchor="middle" font-size="17" font-weight="700" fill="#1F2937">Final context</text><text x="1015" y="228" text-anchor="middle" font-size="13" fill="#64748B">top 3–10</text>
</g></svg>