<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
<rect width="1200" height="520" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#64748b"/></marker></defs>
<text x="55" y="52" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#111827">Indexing vs. query time</text>
<text x="55" y="82" font-family="Arial,sans-serif" font-size="16" fill="#475569">Separate what happens when knowledge is prepared from what happens for each user request.</text>
<g font-family="Arial,sans-serif"><rect x="55" y="125" rx="18" width="1090" height="135" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="82" y="155" font-size="17" font-weight="700" fill="#334155">INDEXING</text><rect x="75" y="180" rx="13" width="150" height="52" fill="#eef2ff" stroke="#6366f1"/><text x="150" y="212" text-anchor="middle" font-size="14" font-weight="700" fill="#312e81">Documents</text><rect x="330" y="180" rx="13" width="150" height="52" fill="#eef2ff" stroke="#6366f1"/><text x="405" y="212" text-anchor="middle" font-size="14" font-weight="700" fill="#312e81">Embedding model</text><rect x="585" y="180" rx="13" width="150" height="52" fill="#eef2ff" stroke="#6366f1"/><text x="660" y="212" text-anchor="middle" font-size="14" font-weight="700" fill="#312e81">Vectors</text><rect x="840" y="180" rx="13" width="150" height="52" fill="#eef2ff" stroke="#6366f1"/><text x="915" y="212" text-anchor="middle" font-size="14" font-weight="700" fill="#312e81">Vector store</text><line x1="225" y1="206" x2="320" y2="206" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><line x1="480" y1="206" x2="575" y2="206" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><line x1="735" y1="206" x2="830" y2="206" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="55" y="305" rx="18" width="1090" height="155" fill="#fffdf7" stroke="#fde68a" stroke-width="2"/><text x="82" y="337" font-size="17" font-weight="700" fill="#92400e">QUERY TIME</text><rect x="40.0" y="365" rx="13" width="170" height="58" fill="#fff7ed" stroke="#f97316"/><text x="125" y="400" text-anchor="middle" font-size="14" font-weight="700" fill="#7c2d12">Question</text><rect x="270.0" y="365" rx="13" width="170" height="58" fill="#fff7ed" stroke="#f97316"/><text x="355" y="400" text-anchor="middle" font-size="14" font-weight="700" fill="#7c2d12">Query embedding</text><rect x="500.0" y="365" rx="13" width="170" height="58" fill="#fff7ed" stroke="#f97316"/><text x="585" y="400" text-anchor="middle" font-size="14" font-weight="700" fill="#7c2d12">Similarity search</text><rect x="730.0" y="365" rx="13" width="170" height="58" fill="#fff7ed" stroke="#f97316"/><text x="815" y="400" text-anchor="middle" font-size="14" font-weight="700" fill="#7c2d12">Retrieved evidence</text><rect x="960.0" y="365" rx="13" width="160" height="58" fill="#fff7ed" stroke="#f97316"/><text x="1040" y="400" text-anchor="middle" font-size="14" font-weight="700" fill="#7c2d12">Context / LLM</text><line x1="210" y1="394" x2="260" y2="394" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><line x1="440" y1="394" x2="490" y2="394" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><line x1="670" y1="394" x2="720" y2="394" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><line x1="900" y1="394" x2="945" y2="394" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/></g></svg>