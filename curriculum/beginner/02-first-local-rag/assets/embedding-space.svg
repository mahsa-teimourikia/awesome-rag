<text x="55" y="52" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#111827">Semantic retrieval intuition</text>
<text x="55" y="82" font-family="Arial,sans-serif" font-size="16" fill="#475569">The embedding model places related text closer together in a vector space.</text>
<g font-family="Arial,sans-serif"><rect x="60" y="120" rx="18" width="1080" height="300" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><circle cx="270" cy="205" r="12" fill="#6366f1"/><text x="290" y="202" font-size="15" font-weight="700" fill="#1f2937">Query</text><text x="290" y="223" font-size="13" fill="#64748b">Who approves a failover?</text><circle cx="385" cy="260" r="12" fill="#16a34a"/><text x="405" y="257" font-size="15" font-weight="700" fill="#1f2937">Policy</text><text x="405" y="278" font-size="13" fill="#64748b">Tier 2 must approve failover</text><circle cx="760" cy="190" r="12" fill="#f97316"/><text x="780" y="187" font-size="15" font-weight="700" fill="#1f2937">Architecture</text><text x="780" y="208" font-size="13" fill="#64748b">PostgreSQL in us-east-1</text><circle cx="870" cy="330" r="12" fill="#0891b2"/><text x="890" y="327" font-size="15" font-weight="700" fill="#1f2937">Incident</text><text x="890" y="348" font-size="13" fill="#64748b">Check gateway status on 503</text><line x1="282" y1="213" x2="373" y2="252" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 5"/><text x="305" y="250" font-size="13" fill="#15803d">closer</text><text x="600" y="390" text-anchor="middle" font-size="14" fill="#475569">Closeness is useful for ranking. It is not proof that a passage is authoritative or correct.</text></g></svg>