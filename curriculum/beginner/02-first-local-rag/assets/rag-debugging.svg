<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570">
<rect width="1200" height="570" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#64748b"/></marker></defs>
<text x="55" y="52" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#111827">Debug RAG in order</text>
<text x="55" y="82" font-family="Arial,sans-serif" font-size="16" fill="#475569">Find the first broken stage instead of compensating downstream.</text>
<g font-family="Arial,sans-serif"><rect x="210" y="130" rx="16" width="780" height="75" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/><text x="245" y="159" font-size="16" font-weight="700" fill="#1f2937">1. Source / ingestion</text><text x="245" y="184" font-size="14" fill="#475569">Does the required evidence exist?</text><line x1="600" y1="205" x2="600" y2="227" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="210" y="235" rx="16" width="780" height="75" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/><text x="245" y="264" font-size="16" font-weight="700" fill="#1f2937">2. Retrieval</text><text x="245" y="289" font-size="14" fill="#475569">Did the correct evidence enter top-k?</text><line x1="600" y1="310" x2="600" y2="332" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="210" y="340" rx="16" width="780" height="75" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="245" y="369" font-size="16" font-weight="700" fill="#1f2937">3. Context construction</text><text x="245" y="394" font-size="14" fill="#475569">Did the evidence survive into the prompt?</text><line x1="600" y1="415" x2="600" y2="437" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="210" y="445" rx="16" width="780" height="75" fill="#fff7ed" stroke="#f97316" stroke-width="2"/><text x="245" y="474" font-size="16" font-weight="700" fill="#1f2937">4. Generation</text><text x="245" y="499" font-size="14" fill="#475569">Did the model faithfully use the evidence?</text></g></svg>