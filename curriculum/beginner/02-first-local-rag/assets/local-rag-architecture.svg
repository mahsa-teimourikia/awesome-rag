xt><rect x="285" y="300" rx="15" width="625" height="68" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="597" y="329" text-anchor="middle" font-size="16" font-weight="700" fill="#334155">Engineering boundary</text><text x="597" y="352" text-anchor="middle" font-size="14" fill="#64748b">Inspect retrieved evidence before deciding whether generation is the problem.</text></g></svg>