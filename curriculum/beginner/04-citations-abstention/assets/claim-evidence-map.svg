<text x="55" y="82" font-size="16" fill="#475569">Map each factual claim to the evidence that actually supports it.</text><rect x="80" y="135" width="470" height="250" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/><text x="315" y="170" text-anchor="middle" font-size="18" font-weight="700" fill="#334155">Generated claims</text><rect x="120" y="200" width="390" height="42" rx="10" fill="#EEF2FF" stroke="#A5B4FC"/><text x="315" y="226" text-anchor="middle" font-size="13" fill="#312E81">Claim 1: update within 30 minutes</text><rect x="120" y="255" width="390" height="42" rx="10" fill="#EEF2FF" stroke="#A5B4FC"/><text x="315" y="281" text-anchor="middle" font-size="13" fill="#312E81">Claim 2: commander sends update</text><rect x="120" y="310" width="390" height="42" rx="10" fill="#EEF2FF" stroke="#A5B4FC"/><text x="315" y="336" text-anchor="middle" font-size="13" fill="#312E81">Claim 3: applies to enterprise tier</text><rect x="690" y="135" width="430" height="250" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/><text x="905" y="170" text-anchor="middle" font-size="18" font-weight="700" fill="#334155">Evidence</text><rect x="735" y="200" width="340" height="42" rx="10" fill="#F0FDF4" stroke="#86EFAC"/><text x="905" y="226" text-anchor="middle" font-size="13" fill="#14532D">chunk-01 · SLA policy</text><rect x="735" y="255" width="340" height="42" rx="10" fill="#F0FDF4" stroke="#86EFAC"/><text x="905" y="281" text-anchor="middle" font-size="13" fill="#14532D">chunk-02 · paging procedure</text><rect x="735" y="310" width="340" height="42" rx="10" fill="#F0FDF4" stroke="#86EFAC"/><text x="905" y="336" text-anchor="middle" font-size="13" fill="#14532D">no supporting evidence</text><line x1="510" y1="221" x2="735" y2="221" stroke="#16A34A" stroke-width="2" marker-end="url(#a)"/><line x1="510" y1="276" x2="735" y2="331" stroke="#EF4444" stroke-width="2" marker-end="url(#a)"/><line x1="510" y1="331" x2="735" y2="221" stroke="#16A34A" stroke-width="2" marker