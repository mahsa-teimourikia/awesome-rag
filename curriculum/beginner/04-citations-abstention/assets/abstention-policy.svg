<text x="55" y="82" font-size="16" fill="#475569">Evidence sufficiency is broader than whether the language model feels uncertain.</text><rect x="100" y="160" width="150" height="75" rx="14" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/><text x="175" y="194" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">Authorized retrieval</text><line x1="250" y1="198" x2="310" y2="198" stroke="#64748B" stroke-width="2" marker-end="url(#a)"/><rect x="320" y="160" width="150" height="75" rx="14" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/><text x="395" y="194" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">Freshness / authority</text><line x1="470" y1="198" x2="530" y2="198" stroke="#64748B" stroke-width="2" marker-end="url(#a)"/><rect x="540" y="160" width="150" height="75" rx="14" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/><text x="615" y="194" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">Conflict check</text><line x1="690" y1="198" x2="750" y2="198" stroke="#64748B" stroke-width="2" marker-end="url(#a)"/><rect x="760" y="160" width="150" height="75" rx="14" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/><text x="835" y="194" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">Evidence sufficiency</text><line x1="910" y1="198" x2="970" y2="198" stroke="#64748B" stroke-width="2" marker-end="url(#a)"/><rect x="980" y="160" width="150" height="75" rx="14" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/><text x="1055" y="194" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">Risk policy</text><line x1="1055" y1="235" x2="1055" y2="310" stroke="#64748B" stroke-width="2" marker-end="url(#a)"/><rect x="860" y="310" width="390" height="75" rx="14" fill="#FFF7ED" stroke="#F97316" stroke-width="2"/><text x="1055" y="354" text-anchor="middle" font-size="16" font-weight="700" fill="#7C2D12">Answer, abstain, clarify, or escalate</text></g></svg>