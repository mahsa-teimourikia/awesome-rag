<text x="55" y="82" font-size="16" fill="#475569">The teaching notebook expresses the decision with an explicit sentinel.</text><rect x="455" y="130" width="290" height="70" rx="15" fill="#EEF2FF" stroke="#6366F1" stroke-width="2"/><text x="600" y="173" text-anchor="middle" font-size="17" font-weight="700" fill="#312E81">Retrieved context + question</text><line x1="600" y1="200" x2="600" y2="260" stroke="#64748B" stroke-width="2" marker-end="url(#a)"/><polygon points="600,260 735,330 600,400 465,330" fill="#FFF7ED" stroke="#F97316" stroke-width="2"/><text x="600" y="326" text-anchor="middle" font-size="15" font-weight="700" fill="#7C2D12">Enough evidence?</text><line x1="465" y1="330" x2="285" y2="330" stroke="#64748B" stroke-width="2" marker-end="url(#a)"/><text x="375" y="315" font-size="13" fill="#64748B">no</text><rect x="80" y="295" width="205" height="70" rx="14" fill="#FEF2F2" stroke="#EF4444" stroke-width="2"/><text x="182" y="337" text-anchor="middle" font-size="16" font-weight="700" fill="#991B1B">Abstain</text><line x1="735" y1="330" x2="915" y2="330" stroke="#64748B" stroke-width="2" marker-end="url(#a)"/><text x="815" y="315" font-size="13" fill="#64748B">yes</text><rect x="915" y="295" width="205" height="70" rx="14" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/><text x="1017" y="337" text-anchor="middle" font-size="16" font-weight="700" fill="#14532D">Answer + cite</text></g></svg>