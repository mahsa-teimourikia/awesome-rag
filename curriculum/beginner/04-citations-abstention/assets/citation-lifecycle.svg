<text x="55" y="82" font-size="16" fill="#475569">Evidence provenance should survive every stage from source to presentation.</text><circle cx="85" cy="215" r="55" fill="#F8FAFC" stroke="#6366F1" stroke-width="2"/><text x="85" y="211" text-anchor="middle" font-size="13" font-weight="700" fill="#312E81">Source</text><line x1="140" y1="215" x2="185" y2="215" stroke="#64748B" stroke-width="2" marker-end="url(#a)"/><circle cx="250" cy="215" r="55" fill="#F8FAFC" stroke="#6366F1" stroke-width="2"/><text x="250" y="211" text-anchor="middle" font-size="13" font-weight="700" fill="#312E81">Stable chunk ID</text><line x1="305" y1="215" x2="350" y2="215" stroke="#64748B" stroke-width="2" marker-end="url(#a)"/><circle cx="415" cy="215" r="55" fill="#F8FAFC" stroke="#6366F1" stroke-width="2"/><text x="415" y="211" text-anchor="middle" font-size="13" font-weight="700" fill="#312E81">Authorized retrieval</text><line x1="470" y1="215" x2="515" y2="215" stroke="#64748B" stroke-width="2" marker-end="url(#a)"/><circle cx="580" cy="215" r="55" fill="#F8FAFC" stroke="#6366F1" stroke-width="2"/><text x="580" y="211" text-anchor="middle" font-size="13" font-weight="700" fill="#312E81">Model context</text><line x1="635" y1="215" x2="680" y2="215" stroke="#64748B" stroke-width="2" marker-end="url(#a)"/><circle cx="745" cy="215" r="55" fill="#F8FAFC" stroke="#6366F1" stroke-width="2"/><text x="745" y="211" text-anchor="middle" font-size="13" font-weight="700" fill="#312E81">Claim + ID</text><line x1="800" y1="215" x2="845" y2="215" stroke="#64748B" stroke-width="2" marker-end="url(#a)"/><circle cx="910" cy="215" r="55" fill="#F8FAFC" stroke="#6366F1" stroke-width="2"/><text x="910" y="211" text-anchor="middle" font-size="13" font-weight="700" fill="#312E81">Validation</text><line x1="965" y1="215" x2="1005" y2="215" stroke="#64748B" stroke-width="2" marker-end="url(#a)"/><circle cx="1070" cy="215" r="55" fill="#F8FAFC" stroke="#6366F1" stroke-width="2"/><text x="1070" y="211" text-anchor="middle" font-size="13" font-weight="700" fill="#312E81">Rendered citation</text><text x="600" y="350" text-anchor="middle" font-size="15" fill="#475569">Preserve identity as structured data; format it for humans only after validation.</text></g></svg>