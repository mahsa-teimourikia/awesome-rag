<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510">
<rect width="1200" height="510" fill="white"/>
<defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#64748B"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif">
<text x="55" y="52" font-size="29" font-weight="700" fill="#111827">Citation quality has multiple dimensions</text>
<text x="55" y="82" font-size="16" fill="#475569">A citation can be present and valid while still failing to support the claim.</text><rect x="90" y="145" width="300" height="100" rx="16" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/><text x="240" y="185" text-anchor="middle" font-size="17" font-weight="700" fill="#1F2937">Presence</text><text x="240" y="214" text-anchor="middle" font-size="14" fill="#64748B">citation shown</text><rect x="460" y="145" width="300" height="100" rx="16" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/><text x="610" y="185" text-anchor="middle" font-size="17" font-weight="700" fill="#1F2937">Validity</text><text x="610" y="214" text-anchor="middle" font-size="14" fill="#64748B">ID exists</text><rect x="830" y="145" width="300" height="100" rx="16" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/><text x="980" y="185" text-anchor="middle" font-size="17" font-weight="700" fill="#1F2937">Correctness</text><text x="980" y="214" text-anchor="middle" font-size="14" fill="#64748B">supports claim</text><rect x="90" y="290" width="300" height="100" rx="16" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/><text x="240" y="330" text-anchor="middle" font-size="17" font-weight="700" fill="#1F2937">Completeness</text><text x="240" y="359" text-anchor="middle" font-size="14" fill="#64748B">claims covered</text><rect x="460" y="290" width="300" height="100" rx="16" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/><text x="610" y="330" text-anchor="middle" font-size="17" font-weight="700" fill="#1F2937">Groundedness</text><text x="610" y="359" text-anchor="middle" font-size="14" fill="#64748B">stays in context</text><rect x="830" y="290" width="300" height="100" rx="16" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/><text x="980" y="330" text-anchor="middle" font-size="17" font-weight="700" fill="#1F2937">Factuality</text><text x="980" y="359" text-anchor="middle" font-size="14" fill="#64748B">true in world</text><text x="600" y="465" text-anchor="middle" font-size="14" fill="#475569">These dimensions are related, but none is a substitute for the others.</text></g></svg>