<defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#64748B"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif">
<text x="55" y="52" font-size="29" font-weight="700" fill="#111827">Evidence → answer decision</text>
<text x="55" y="82" font-size="16" fill="#475569">Citations and abstention turn retrieved context into an auditable application decision.</text><rect x="80" y="165" width="160" height="75" rx="14" fill="#EEF2FF" stroke="#6366F1" stroke-width="2"/><text x="160" y="208" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2937">Retrieved evidence</text><line x1="240" y1="202" x2="290" y2="202" stroke="#64748B" stroke-width="2" marker-end="url(#a)"/><rect x="300" y="165" width="160" height="75" rx="14" fill="#ECFEFF" stroke="#0891B2" stroke-width="2"/><text x="380" y="208" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2937">Evidence identity</text><line x1="460" y1="202" x2="510" y2="202" stroke="#64748B" stroke-width="2" marker-end="url(#a)"/><rect x="520" y="165" width="160" height="75" rx="14" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/><text x="600" y="208" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2937">Answerability</text><line x1="680" y1="202" x2="730" y2="202" stroke="#64748B" stroke-width="2" marker-end="url(#a)"/><rect x="740" y="165" width="160" height="75" rx="14" fill="#FFF7ED" stroke="#F97316" stroke-width="2"/><text x="820" y="208" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2937">Generate + cite</text><line x1="900" y1="202" x2="950" y2="202" stroke="#64748B" stroke-width="2" marker-end="url(#a)"/><rect x="960" y="165" width="160" height="75" rx="14" fill="#FAF5FF" stroke="#A855F7" stroke-width="2"/><text x="1040" y="208" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2937">Validate</text><rect x="310" y="310" width="580" height="90" rx="15" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/><text x="600" y="343" text-anchor="middle" font-size="16" font-weight="700" fill="#334155">Decision</text><text x="600" y="370" text-anchor="middle" font-size="14" fill="#64748B">Render supported answer — or abstain with an explicit reason.</text></g></svg>