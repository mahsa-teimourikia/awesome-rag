<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500">
<rect width="1200" height="500" fill="#fff"/>
<defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#64748b"/></marker></defs>
<g font-family="Arial,sans-serif"><text x="55" y="52" font-size="29" font-weight="700" fill="#111827">Chunk size is a trade-off</text>
<text x="55" y="82" font-size="16" fill="#475569">Optimize for retrieval specificity and evidence completeness—not a universal token count.</text><rect x="90" y="135" rx="18" width="430" height="280" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="305" y="175" text-anchor="middle" font-size="21" font-weight="700" fill="#1e3a8a">Smaller chunks</text><text x="140" y="220" font-size="15" fill="#334155">• More specific retrieval</text><text x="140" y="256" font-size="15" fill="#334155">• Finer citations</text><text x="140" y="292" font-size="15" fill="#334155">• Less unrelated text</text><text x="140" y="328" font-size="15" fill="#334155">• Risk: context gets split</text><text x="140" y="364" font-size="15" fill="#334155">• More chunks to assemble</text><rect x="680" y="135" rx="18" width="430" height="280" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="895" y="175" text-anchor="middle" font-size="21" font-weight="700" fill="#14532d">Larger chunks</text><text x="730" y="220" font-size="15" fill="#334155">• More context together</text><text x="730" y="256" font-size="15" fill="#334155">• Qualifications survive</text><text x="730" y="292" font-size="15" fill="#334155">• Fewer fragments</text><text x="730" y="328" font-size="15" fill="#334155">• Risk: diluted representation</text><text x="730" y="364" font-size="15" fill="#334155">• Consumes context faster</text></g></svg>