<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470">
<rect width="1200" height="470" fill="#fff"/>
<defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#64748b"/></marker></defs>
<g font-family="Arial,sans-serif"><text x="55" y="52" font-size="29" font-weight="700" fill="#111827">Chunking defines the evidence boundary</text>
<text x="55" y="82" font-size="16" fill="#475569">The retriever can only return information that survives together inside an indexed unit.</text><rect x="80" y="160" rx="16" width="210" height="78" fill="#eef2ff" stroke="#64748b" stroke-width="2"/><text x="185" y="206" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937">Source document</text><line x1="290" y1="199" x2="340" y2="199" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="350" y="160" rx="16" width="210" height="78" fill="#ecfeff" stroke="#64748b" stroke-width="2"/><text x="455" y="206" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937">Chunking</text><line x1="560" y1="199" x2="610" y2="199" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="620" y="160" rx="16" width="210" height="78" fill="#f0fdf4" stroke="#64748b" stroke-width="2"/><text x="725" y="206" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937">Retrieval units</text><line x1="830" y1="199" x2="880" y2="199" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="890" y="160" rx="16" width="210" height="78" fill="#fff7ed" stroke="#64748b" stroke-width="2"/><text x="995" y="206" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937">Retriever</text><rect x="310" y="305" rx="15" width="580" height="85" fill="#f8fafc" stroke="#cbd5e1"/><text x="600" y="337" text-anchor="middle" font-size="16" font-weight="700" fill="#334155">If a rule and its exception are separated here...</text><text x="600" y="365" text-anchor="middle" font-size="14" fill="#64748b">...a better prompt cannot reconstruct the missing evidence.</text></g></svg>