<defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#64748b"/></marker></defs>
<g font-family="Arial,sans-serif"><text x="55" y="52" font-size="29" font-weight="700" fill="#111827">Naive vs. recursive splitting</text>
<text x="55" y="82" font-size="16" fill="#475569">Recursive splitting respects preferred separators; it does not understand semantics.</text><text x="85" y="135" font-size="18" font-weight="700" fill="#b91c1c">Naive character window</text><rect x="75" y="165" rx="10" width="245" height="80" fill="#fef2f2" stroke="#ef4444"/><text x="197" y="198" text-anchor="middle" font-size="13" fill="#7f1d1d">## Cloud Infrastructure</text><rect x="350" y="165" rx="10" width="245" height="80" fill="#fef2f2" stroke="#ef4444"/><text x="472" y="198" text-anchor="middle" font-size="13" fill="#7f1d1d">The migration to the new distri</text><rect x="625" y="165" rx="10" width="245" height="80" fill="#fef2f2" stroke="#ef4444"/><text x="747" y="198" text-anchor="middle" font-size="13" fill="#7f1d1d">buted cluster... costs increased</text><rect x="900" y="165" rx="10" width="245" height="80" fill="#fef2f2" stroke="#ef4444"/><text x="1022" y="198" text-anchor="middle" font-size="13" fill="#7f1d1d">by 14% compared to...</text><text x="85" y="315" font-size="18" font-weight="700" fill="#166534">Recursive separator-aware split</text><rect x="75" y="345" rx="10" width="245" height="80" fill="#f0fdf4" stroke="#22c55e"/><text x="197" y="378" text-anchor="middle" font-size="13" fill="#14532d">## Cloud Infrastructure</text><rect x="350" y="345" rx="10" width="245" height="80" fill="#f0fdf4" stroke="#22c55e"/><text x="472" y="378" text-anchor="middle" font-size="13" fill="#14532d">Migration to the new distributed</text><rect x="625" y="345" rx="10" width="245" height="80" fill="#f0fdf4" stroke="#22c55e"/><text x="747" y="378" text-anchor="middle" font-size="13" fill="#14532d">cluster architecture...</text><rect x="900" y="345" rx="10" width="245" height="80" fill="#f0fdf4" stroke="#22c55e"/><text x="1022" y="378" text-anchor="middle" font-size="13" fill="#14532d">costs increased by 14%...</text></g></svg>