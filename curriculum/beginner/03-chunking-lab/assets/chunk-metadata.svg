<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500">
<rect width="1200" height="500" fill="#fff"/>
<defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#64748b"/></marker></defs>
<g font-family="Arial,sans-serif"><text x="55" y="52" font-size="29" font-weight="700" fill="#111827">Metadata inheritance</text>
<text x="55" y="82" font-size="16" fill="#475569">Every derived chunk should remain traceable to its source and governance context.</text><rect x="80" y="145" rx="16" width="300" height="220" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/><text x="230" y="180" text-anchor="middle" font-size="18" font-weight="700" fill="#312e81">Source document</text><text x="130" y="220" font-size="14" fill="#475569">document_id</text><text x="130" y="248" font-size="14" fill="#475569">version</text><text x="130" y="276" font-size="14" fill="#475569">source</text><text x="130" y="304" font-size="14" fill="#475569">tenant / ACL</text><text x="130" y="332" font-size="14" fill="#475569">updated_at</text><line x1="380" y1="255" x2="510" y2="255" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="520" y="125" rx="16" width="600" height="270" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="820" y="160" text-anchor="middle" font-size="18" font-weight="700" fill="#14532d">Derived chunk</text><text x="570" y="210" font-size="14" fill="#334155">inherits: document_id · version · source · tenant / ACL · updated_at</text><text x="570" y="252" font-size="14" fill="#334155">adds: chunk_id · section · ordinal · parent_id</text><text x="570" y="294" font-size="14" fill="#334155">records: parser_version · chunker_version</text><text x="570" y="336" font-size="14" fill="#334155">later: embedding_version · index_version</text></g></svg>