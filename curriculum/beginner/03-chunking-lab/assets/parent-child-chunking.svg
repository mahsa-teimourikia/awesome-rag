<text x="55" y="82" font-size="16" fill="#475569">Retrieve a precise child; expand to a larger parent when generation needs more context.</text><rect x="130" y="140" rx="18" width="940" height="270" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="600" y="175" text-anchor="middle" font-size="18" font-weight="700" fill="#334155">Parent: Database Failover section</text><rect x="190" y="225" rx="13" width="170" height="75" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/><text x="275" y="267" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">Child A</text><rect x="400" y="225" rx="13" width="170" height="75" fill="#fff7ed" stroke="#f97316" stroke-width="2"/><text x="485" y="267" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">Child B</text><rect x="610" y="225" rx="13" width="170" height="75" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/><text x="695" y="267" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">Child C</text><rect x="820" y="225" rx="13" width="170" height="75" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/><text x="905" y="267" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">Child D</text><text x="485" y="340" text-anchor="middle" font-size="14" font-weight="700" fill="#c2410c">retrieval hit</text><line x1="485" y1="300" x2="485" y2="325" stroke="#f97316" stroke-width="2" marker-end="url(#a)"/><text x="600" y="455" text-anchor="middle" font-size="14" fill="#475569">Small unit for matching → larger unit for complete evidence.</text></g></svg>