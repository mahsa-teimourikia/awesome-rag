<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470">
<rect width="1200" height="470" fill="#ffffff"/>
<text x="60" y="58" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#111827">Where a RAG answer can fail</text>
<text x="60" y="92" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#4b5563">An incorrect answer is not automatically an LLM failure.</text>
<defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#94a3b8"/></marker></defs>
<g font-family="Arial,Helvetica,sans-serif">
<rect x="70" y="165" rx="14" width="130" height="74" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="135" y="194" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">Source</text><text x="135" y="218" text-anchor="middle" font-size="13" fill="#475569">stale / wrong</text><line x1="200" y1="202" x2="225" y2="202" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#a)"/><rect x="225" y="165" rx="14" width="130" height="74" fill="#fff7ed" stroke="#f97316" stroke-width="2"/><text x="290" y="194" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">Parsing</text><text x="290" y="218" text-anchor="middle" font-size="13" fill="#475569">content lost</text><line x1="355" y1="202" x2="380" y2="202" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#a)"/><rect x="380" y="165" rx="14" width="130" height="74" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="445" y="194" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">Retrieval</text><text x="445" y="218" text-anchor="middle" font-size="13" fill="#475569">missed evidence</text><line x1="510" y1="202" x2="535" y2="202" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#a)"/><rect x="535" y="165" rx="14" width="130" height="74" fill="#f7fee7" stroke="#84cc16" stroke-width="2"/><text x="600" y="194" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">Ranking</text><text x="600" y="218" text-anchor="middle" font-size="13" fill="#475569">wrong order</text><line x1="665" y1="202" x2="690" y2="202" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#a)"/><rect x="690" y="165" rx="14" width="130" height="74" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="755" y="194" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">Context</text><text x="755" y="218" text-anchor="middle" font-size="13" fill="#475569">diluted</text><line x1="820" y1="202" x2="845" y2="202" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#a)"/><rect x="845" y="165" rx="14" width="130" height="74" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="910" y="194" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">Generation</text><text x="910" y="218" text-anchor="middle" font-size="13" fill="#475569">unsupported claim</text><line x1="975" y1="202" x2="1000" y2="202" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#a)"/><rect x="1000" y="165" rx="14" width="130" height="74" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/><text x="1065" y="194" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">Verification</text><text x="1065" y="218" text-anchor="middle" font-size="13" fill="#475569">bad citation</text>
<rect x="260" y="310" rx="16" width="680" height="90" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="600" y="342" text-anchor="middle" font-size="18" font-weight="700" fill="#334155">Diagnose the stage before changing the prompt</text>
<text x="600" y="370" text-anchor="middle" font-size="14" fill="#64748b">Retrieval quality, context quality, groundedness, factuality and citation correctness are different problems.</text>
</g>
</svg>