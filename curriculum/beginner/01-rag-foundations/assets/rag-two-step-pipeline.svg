<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
<rect width="1200" height="520" fill="#ffffff"/>
<text x="60" y="58" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#111827">Two-step RAG architecture</text>
<text x="60" y="92" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#4b5563">Knowledge preparation happens before query-time retrieval and generation.</text>
<defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#64748b"/></marker></defs>
<g font-family="Arial,Helvetica,sans-serif">
<rect x="60" y="135" rx="18" width="1080" height="135" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="90" y="168" font-size="17" font-weight="700" fill="#334155">Knowledge preparation</text>
<rect x="130" y="190" rx="14" width="170" height="58" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/><text x="215" y="225" text-anchor="middle" font-size="16" font-weight="700" fill="#312e81">Documents</text>
<rect x="385" y="190" rx="14" width="170" height="58" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/><text x="470" y="225" text-anchor="middle" font-size="16" font-weight="700" fill="#164e63">Embeddings</text>
<rect x="640" y="190" rx="14" width="170" height="58" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="725" y="225" text-anchor="middle" font-size="16" font-weight="700" fill="#14532d">Vector store</text>
<line x1="300" y1="219" x2="385" y2="219" stroke="#64748b" stroke-width="2.2" marker-end="url(#a)"/>
<line x1="555" y1="219" x2="640" y2="219" stroke="#64748b" stroke-width="2.2" marker-end="url(#a)"/>

<rect x="60" y="310" rx="18" width="1080" height="145" fill="#fffdf7" stroke="#fde68a" stroke-width="2"/>
<text x="90" y="344" font-size="17" font-weight="700" fill="#92400e">Query time</text>
<rect x="105" y="365" rx="14" width="150" height="58" fill="#fff7ed" stroke="#f97316" stroke-width="2"/><text x="180" y="400" text-anchor="middle" font-size="15" font-weight="700" fill="#7c2d12">Question</text>
<rect x="325" y="365" rx="14" width="150" height="58" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/><text x="400" y="400" text-anchor="middle" font-size="15" font-weight="700" fill="#713f12">Retriever</text>
<rect x="545" y="365" rx="14" width="150" height="58" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="620" y="400" text-anchor="middle" font-size="15" font-weight="700" fill="#065f46">Context</text>
<rect x="765" y="365" rx="14" width="150" height="58" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="840" y="400" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">LLM</text>
<rect x="985" y="365" rx="14" width="105" height="58" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/><text x="1037" y="400" text-anchor="middle" font-size="15" font-weight="700" fill="#312e81">Answer</text>
<line x1="255" y1="394" x2="325" y2="394" stroke="#64748b" stroke-width="2.2" marker-end="url(#a)"/>
<line x1="475" y1="394" x2="545" y2="394" stroke="#64748b" stroke-width="2.2" marker-end="url(#a)"/>
<line x1="695" y1="394" x2="765" y2="394" stroke="#64748b" stroke-width="2.2" marker-end="url(#a)"/>
<line x1="915" y1="394" x2="985" y2="394" stroke="#64748b" stroke-width="2.2" marker-end="url(#a)"/>
<line x1="725" y1="270" x2="400" y2="365" stroke="#64748b" stroke-width="2.2" marker-end="url(#a)"/>
</g>
</svg>