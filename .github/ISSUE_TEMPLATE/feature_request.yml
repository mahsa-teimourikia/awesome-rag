name: Feature request
description: Propose a focused repository, curriculum, tooling, or Learning Hub capability.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the learner, contributor, or maintainer need—not only the desired implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Explain the behavior, learning outcome, or workflow you want.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Note simpler approaches or existing material that may already address part of the need.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable conditions that would make the request complete.
      placeholder: |
        - [ ] …
        - [ ] …
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission check
      options:
        - label: I searched existing issues, pull requests, the curriculum, and the roadmap for this request.
          required: true

